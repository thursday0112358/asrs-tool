name: Update ASRS Data

on:
  schedule:
    - cron: '0 13 * * 1'  # Every Monday at 13:00 UTC = 8am ET (EST); 9am during EDT
  workflow_dispatch:       # Allow manual runs from the Actions tab

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python data_fetcher.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/asrs_data.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update ASRS data $(date -u +%Y-%m-%d)" && git push
